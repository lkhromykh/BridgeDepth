[project]
name = "bridgedepth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.33.1",
    "imageio>=2.37.0",
    "matplotlib>=3.10.3",
    "omegaconf>=2.3.0",
    "onnx>=1.19.0",
    "opencv-python>=4.11.0.86",
    "pillow>=11.0.0",
    "tabulate>=0.9.0",
    "tensorboard>=2.19.0",
    "termcolor>=3.1.0",
    "yacs>=0.1.8",
    "open3d==0.19",
    "onnxruntime-gpu>=1.30.0,<2",
    "tensorrt<11",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = { driver = "13.0", arch = "8.9" }, archspec = "zen4", glibc = "2.39", linux = "7.0.0" }]

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/python3.12/site-packages/tensorrt_libs:$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}"

[tool.pixi.dependencies]
python = "3.12.*"
cuda-version = "==13.0"
cuda-runtime = ">=13.0.3,<14"
cudnn = ">=9.26.0.51,<10"

[tool.pixi.pypi-dependencies]
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu126" }
