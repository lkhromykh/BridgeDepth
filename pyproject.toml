[project]
name = "bridgedepth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.33.1",
    "imageio>=2.37.0",
    "matplotlib>=3.10.3",
    "omegaconf>=2.3.0",
    "onnx>=1.19.0",
    "opencv-python>=4.11.0.86",
    "pillow>=11.0.0",
    "tabulate>=0.9.0",
    "tensorboard>=2.19.0",
    "termcolor>=3.1.0",
    "yacs>=0.1.8",
    "open3d",
    "onnxruntime-gpu>=1.26.0,<1.27.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.39", cuda = "12.6" }]

[activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tool.pixi.dependencies]
python = "3.12.*"
cuda-version = "==12.6"
cuda-runtime = ">=12.6.3,<13"
cudnn = ">=9.10.2.21,<10"

[tool.pixi.pypi-dependencies]
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu126" }
